<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aarohan Décor — Premium Home Décor</title>
    <meta name="description" content="Beautiful objects for beautiful spaces. Shop wall clocks, stone art, vases, mirrors, lighting and curated home décor." />
    <meta property="og:title" content="Aarohan Décor — Premium Home Décor" />
    <meta property="og:description" content="Thoughtfully designed décor that turns everyday spaces into something extraordinary." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #f7f6f1; /* Prevent black flash before app loads */
      }
      #aarohan-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #f7f6f1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        width: 100vw;
        height: 100vh;
      }
      
      #aarohan-splash.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      
      .splash-logo {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
        opacity: 0;
        transform: translateY(10px);
        animation: reveal-fade 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      
      .splash-brand {
        font-family: 'Cormorant Garamond', serif;
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #4a3c31;
        margin-bottom: 32px;
        opacity: 0;
        transform: translateY(10px);
        animation: reveal-fade 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
      }
      
      .splash-indicator {
        width: 40px;
        height: 40px;
        position: relative;
        opacity: 0;
        animation: fade-in 1s ease 0.6s forwards;
      }
      
      .splash-indicator svg {
        width: 100%;
        height: 100%;
        animation: rotate 2s linear infinite;
      }
      
      .splash-indicator circle {
        fill: none;
        stroke: #4a3c31;
        stroke-width: 1.5;
        stroke-dasharray: 90, 150;
        stroke-dashoffset: 0;
        stroke-linecap: round;
        animation: dash 1.5s ease-in-out infinite;
      }

      @keyframes reveal-fade {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      @keyframes fade-in {
        to { opacity: 1; }
      }
      
      @keyframes rotate {
        100% { transform: rotate(360deg); }
      }
      
      @keyframes dash {
        0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
        100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
      }
    </style>
  </head>
  <body>
    <div id="aarohan-splash">
      <div class="splash-content">
        <img src="/favicon.svg" alt="Aarohan Décor" class="splash-logo" />
        <div class="splash-brand">Arohan Décor</div>
        <div class="splash-indicator">
          <svg viewBox="25 25 50 50">
            <circle cx="50" cy="50" r="20"></circle>
          </svg>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
